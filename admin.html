<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpeedFlex — Painel de solicitações</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050709; --panel:#0c1119; --panel-2:#0f1723;
    --blue:#2f8fff; --blue-2:#7fd1ff; --white:#f3f6fa; --grey:#8b95a5; --line:#1c2733;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--white);
    font-family:'Inter',system-ui,sans-serif;padding:32px 20px;
  }
  h1,h2{font-family:'Rajdhani',sans-serif;}
  .wrap{max-width:960px;margin:0 auto;}
  .login-box{
    max-width:360px;margin:12vh auto 0;padding:32px;border:1px solid var(--line);
    border-radius:10px;background:linear-gradient(180deg,var(--panel),var(--panel-2));
  }
  .login-box h1{font-size:24px;margin:0 0 6px;}
  .login-box p{color:var(--grey);font-size:14px;margin:0 0 20px;}
  input{
    width:100%;padding:12px 14px;border-radius:5px;border:1px solid var(--line);
    background:#0a0f16;color:var(--white);font-size:15px;margin-bottom:12px;
  }
  button{
    width:100%;padding:12px;border-radius:5px;border:none;font-weight:700;font-size:15px;
    background:linear-gradient(135deg,var(--blue),#1c6fe0);color:#04070c;cursor:pointer;
    font-family:'Rajdhani',sans-serif;letter-spacing:.3px;
  }
  .erro{color:#ff8080;font-size:13px;margin:-4px 0 12px;min-height:16px;}

  header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
  header.top h1{font-size:26px;margin:0;}
  .btn-secundario{
    width:auto;background:transparent;border:1px solid var(--line);color:var(--white);
    padding:9px 16px;font-size:14px;
  }

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{color:var(--blue-2);font-family:'Rajdhani';font-weight:700;font-size:13px;letter-spacing:.4px;}
  td.desc{max-width:320px;color:var(--grey);line-height:1.5;}
  td.data{color:var(--grey);white-space:nowrap;font-size:13px;}
  .vazio{color:var(--grey);text-align:center;padding:40px 0;}
  .card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);}
  .table-wrap{overflow-x:auto;}
  #status-msg{color:var(--grey);font-size:13px;margin-bottom:14px;}
</style>
</head>
<body>

<div id="login" class="login-box">
  <h1>Painel SpeedFlex</h1>
  <p>Digite a senha de administrador para ver as solicitações.</p>
  <input id="senha" type="password" placeholder="Senha" autofocus>
  <p class="erro" id="login-erro"></p>
  <button onclick="entrar()">Entrar</button>
</div>

<div id="painel" class="wrap" style="display:none;">
  <header class="top">
    <h1>Solicitações recebidas</h1>
    <div style="display:flex;gap:10px;">
      <button class="btn-secundario" onclick="carregar()">Atualizar</button>
      <button class="btn-secundario" onclick="sair()">Sair</button>
    </div>
  </header>
  <p id="status-msg"></p>
  <div class="card">
    <div class="table-wrap">
      <table id="tabela" style="display:none;">
        <thead>
          <tr><th>Nome</th><th>Telefone</th><th>Tipo</th><th>Descrição</th><th>Recebido em</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <p class="vazio" id="vazio-msg" style="display:none;"></p>
    </div>
  </div>
</div>

<script>
  const TIPOS = {
    'lentidao': 'PC lento / travando',
    'nao-liga': 'Não liga / desliga sozinho',
    'virus': 'Vírus ou malware',
    'upgrade': 'Upgrade de peças',
    'outro': 'Outro'
  };

  function getSenha(){ return sessionStorage.getItem('speedflex_admin_senha'); }

  async function entrar(){
    const senha = document.getElementById('senha').value;
    const erroEl = document.getElementById('login-erro');
    erroEl.textContent = '';
    if(!senha){ erroEl.textContent = 'Digite a senha.'; return; }
    sessionStorage.setItem('speedflex_admin_senha', senha);
    const ok = await carregar();
    if(ok){
      document.getElementById('login').style.display = 'none';
      document.getElementById('painel').style.display = 'block';
    } else {
      erroEl.textContent = 'Senha incorreta.';
      sessionStorage.removeItem('speedflex_admin_senha');
    }
  }

  function sair(){
    sessionStorage.removeItem('speedflex_admin_senha');
    document.getElementById('painel').style.display = 'none';
    document.getElementById('login').style.display = 'block';
    document.getElementById('senha').value = '';
  }

  async function carregar(){
    const senha = getSenha();
    if(!senha) return false;
    const status = document.getElementById('status-msg');
    status.textContent = 'Carregando...';
    try{
      const resp = await fetch('/api/admin', {
        headers: { 'x-admin-password': senha }
      });
      if(resp.status === 401){ status.textContent = ''; return false; }
      const data = await resp.json();
      if(!resp.ok) throw new Error(data.error || 'Erro ao carregar.');
      renderizar(data.solicitacoes);
      status.textContent = data.solicitacoes.length + ' solicitação(ões).';
      return true;
    } catch(err){
      status.textContent = err.message;
      return false;
    }
  }

  function renderizar(lista){
    const tbody = document.getElementById('tbody');
    const tabela = document.getElementById('tabela');
    const vazio = document.getElementById('vazio-msg');
    tbody.innerHTML = '';
    if(!lista || lista.length === 0){
      tabela.style.display = 'none';
      vazio.style.display = 'block';
      vazio.textContent = 'Nenhuma solicitação recebida ainda.';
      return;
    }
    tabela.style.display = 'table';
    vazio.style.display = 'none';
    lista.forEach(item => {
      const tr = document.createElement('tr');
      const data = new Date(item.criado_em).toLocaleString('pt-BR');
      tr.innerHTML = `
        <td>${escapeHtml(item.nome)}</td>
        <td>${escapeHtml(item.telefone)}</td>
        <td>${escapeHtml(TIPOS[item.tipo_problema] || item.tipo_problema)}</td>
        <td class="desc">${escapeHtml(item.descricao)}</td>
        <td class="data">${data}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  // Se já tiver senha salva na sessão (aba aberta), tenta entrar direto.
  (async function init(){
    if(getSenha()){
      const ok = await carregar();
      if(ok){
        document.getElementById('login').style.display = 'none';
        document.getElementById('painel').style.display = 'block';
      }
    }
  })();

  document.getElementById('senha').addEventListener('keydown', function(e){
    if(e.key === 'Enter') entrar();
  });
</script>

</body>
</html>
